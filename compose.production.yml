x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oneclick_trip}
      MYSQL_USER: ${MYSQL_USERNAME:-oneclick_trip}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=100
      - --innodb-buffer-pool-size=256M
      - --performance-schema=ON
      - --slow-query-log=ON
      - --slow-query-log-file=/var/lib/mysql/mysql-slow.log
      - --long-query-time=${MYSQL_SLOW_QUERY_SECONDS:-1}
      - --log-queries-not-using-indexes=ON
      - --min-examined-row-limit=${MYSQL_SLOW_QUERY_MIN_ROWS:-100}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ops/mysql/init-observability.sh:/docker-entrypoint-initdb.d/20-observability.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    logging: *default-logging
    networks: [app]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    logging: *default-logging
    networks: [app]

  redis-replica:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --replicaof redis 6379 --masterauth "$$REDIS_PASSWORD" --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_replica_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m
    logging: *default-logging
    networks: [app]

  redis-sentinel-1: &redis-sentinel
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - |
        if [ ! -s /data/sentinel.conf ]; then
          MASTER_IP="$$(getent hosts redis | awk 'NR==1 { print $$1 }')"
          printf '%s\n' \
            'port 26379' \
            "sentinel monitor oneclick-trip-master $$MASTER_IP 6379 2" \
            "sentinel auth-pass oneclick-trip-master $$REDIS_PASSWORD" \
            'sentinel down-after-milliseconds oneclick-trip-master 5000' \
            'sentinel failover-timeout oneclick-trip-master 30000' \
            'sentinel parallel-syncs oneclick-trip-master 1' \
            "requirepass $$REDIS_PASSWORD" > /data/sentinel.conf
        fi
        exec redis-sentinel /data/sentinel.conf
    volumes:
      - redis_sentinel_1_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      redis:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    mem_limit: 64m
    logging: *default-logging
    networks: [app]

  redis-sentinel-2:
    <<: *redis-sentinel
    volumes:
      - redis_sentinel_2_data:/data

  redis-sentinel-3:
    <<: *redis-sentinel
    volumes:
      - redis_sentinel_3_data:/data

  chroma:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/data
    mem_limit: 768m
    logging: *default-logging
    # Chroma 1.5.9 is affected by upstream advisories with no patched release.
    # Keep it on a dedicated internal network so only the AI service can reach
    # its HTTP API; never publish the Chroma port on the host.
    networks: [vector_internal]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-oneclick_trip}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=15000&tcpKeepAlive=true
      MYSQL_USERNAME: ${MYSQL_USERNAME:-oneclick_trip}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_SQL_INIT_MODE: never
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-https://yjzdev.cn,https://www.yjzdev.cn,https://api-trip.yjzdev.cn}
      AI_INTERNAL_SERVICE_SECRET: ${AI_INTERNAL_SERVICE_SECRET}
      AI_SERVICE_BASE_URL: http://ai:8000
      AI_SERVICE_CONNECT_TIMEOUT: 5s
      AI_SERVICE_READ_TIMEOUT: 180s
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_MAX_SIZE:-15}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${DB_POOL_MIN_IDLE:-3}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${DB_POOL_CONNECTION_TIMEOUT_MS:-5000}
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: ${DB_POOL_VALIDATION_TIMEOUT_MS:-3000}
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: ${DB_POOL_IDLE_TIMEOUT_MS:-600000}
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: ${DB_POOL_MAX_LIFETIME_MS:-1800000}
      SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD: ${DB_POOL_LEAK_DETECTION_MS:-20000}
      SPRING_JDBC_TEMPLATE_QUERY_TIMEOUT: ${DB_QUERY_TIMEOUT:-10s}
      MYBATIS_PLUS_CONFIGURATION_DEFAULT_STATEMENT_TIMEOUT: ${DB_QUERY_TIMEOUT_SECONDS:-10}
      APP_DATABASE_MONITOR_SLOW_THRESHOLD_MS: ${DB_SLOW_THRESHOLD_MS:-1000}
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=25 -XX:+UseG1GC
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 1g
    logging: *default-logging
    networks: [app]

  ai:
    build:
      context: ./ai/travel_agent
    restart: unless-stopped
    environment:
      APP_ENV: production
      INFRA_MODE: external
      BUSINESS_BACKEND: java
      JAVA_BACKEND_BASE_URL: http://backend:8080
      AI_INTERNAL_SERVICE_SECRET: ${AI_INTERNAL_SERVICE_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_SENTINEL_HOSTS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_SENTINEL_MASTER: oneclick-trip-master
      REDIS_SENTINEL_PASSWORD: ${REDIS_PASSWORD}
      CHECKPOINT_TTL_MINUTES: ${CHECKPOINT_TTL_MINUTES:-1440}
      CHECKPOINT_REFRESH_ON_READ: "true"
      AGENT_JOB_TTL_MINUTES: ${AGENT_JOB_TTL_MINUTES:-1440}
      CHROMA_SERVER_URL: http://chroma:8000
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-travel_knowledge_hash_v1}
      EMBEDDING_BACKEND: hash
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_FLASH_MODEL: ${DEEPSEEK_FLASH_MODEL:-deepseek-v4-flash}
      DEEPSEEK_PRO_MODEL: ${DEEPSEEK_PRO_MODEL:-deepseek-v4-pro}
      TOOL_HTTP_TIMEOUT_SECONDS: ${TOOL_HTTP_TIMEOUT_SECONDS:-15}
      AGENT_REACH_ENABLED: "false"
      XIAOHONGSHU_ENABLED: "false"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      chroma:
        condition: service_started
    mem_limit: 1280m
    logging: *default-logging
    networks: [app, vector_internal]

networks:
  app:
    driver: bridge
  vector_internal:
    driver: bridge
    internal: true

volumes:
  mysql_data:
  redis_data:
  redis_replica_data:
  redis_sentinel_1_data:
  redis_sentinel_2_data:
  redis_sentinel_3_data:
  chroma_data:
