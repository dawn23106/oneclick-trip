server {
    server_name api-trip.yjzdev.cn;

    client_max_body_size 10m;

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/assets/ {
        root /var/www/oneclick-trip-admin;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /admin/ {
        root /var/www/oneclick-trip-admin;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api-trip.yjzdev.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-trip.yjzdev.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-trip.yjzdev.cn;
    return 301 https://$host$request_uri;
}
